<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Hiragana Flash Cards</title>
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="assets/icons/apple-touch-icon.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="assets/icons/favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="assets/icons/favicon-16x16.png"
    />
    <link rel="shortcut icon" href="assets/icons/favicon.ico" />
    <link rel="manifest" href="site.webmanifest" />
    <link rel="stylesheet" href="assets/css/styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="quiz-panel" aria-labelledby="app-title">
        <div class="left-column">
          <header class="app-header">
            <h1 id="app-title">Hiragana Flash Cards</h1>
          </header>

          <form id="settings-form" class="settings">
            <fieldset>
              <legend class="sr-only">Character sets</legend>
              <div class="fieldset-heading">
                <span class="fieldset-title">Character sets</span>
                <button
                  type="button"
                  id="toggle-all-button"
                  class="text-button"
                >
                  Toggle All
                </button>
              </div>
              <div id="set-options" class="set-grid"></div>
            </fieldset>

            <fieldset>
              <legend>Card size</legend>
              <div class="segmented-control">
                <label>
                  <input type="radio" name="card-size" value="1" checked />
                  <span>1</span>
                </label>
                <label>
                  <input type="radio" name="card-size" value="3" />
                  <span>3</span>
                </label>
                <label>
                  <input type="radio" name="card-size" value="4" />
                  <span>4</span>
                </label>
              </div>
            </fieldset>

            <fieldset>
              <legend>Type</legend>
              <div class="segmented-control type-control">
                <label>
                  <input
                    type="radio"
                    name="card-type"
                    value="choices"
                    checked
                  />
                  <span>Choices</span>
                </label>
                <label>
                  <input type="radio" name="card-type" value="input" />
                  <span>Input</span>
                </label>
              </div>
            </fieldset>

            <div class="toolbar">
              <button
                type="submit"
                id="start-button"
                class="primary-button"
                disabled
              >
                Start Quiz
              </button>
              <button
                type="button"
                id="reset-score-button"
                class="secondary-button"
              >
                Reset Score
              </button>
            </div>
          </form>
        </div>

        <div class="right-column">
          <div class="score-box" aria-live="polite">
            <button
              type="button"
              id="sound-toggle-button"
              class="sound-toggle-button"
              aria-pressed="true"
            >
              Sound On
            </button>
            <div class="score-readout">
              <span id="score-text">0 / 0</span>
              <small id="accuracy-text">0%</small>
              <small
                >Best streak: <strong id="best-score-text">0</strong></small
              >
            </div>
          </div>

          <section id="quiz-area" class="quiz-area" hidden>
            <div class="flashcard" aria-live="polite">
              <div id="symbol-text" class="symbol-text">あ</div>
            </div>

            <div id="choices" class="choices" role="list"></div>

            <form id="answer-form" class="answer-form" hidden>
              <label class="sr-only" for="answer-input">Type your answer</label>
              <div class="answer-controls">
                <input
                  id="answer-input"
                  class="answer-input"
                  type="text"
                  autocomplete="off"
                  autocapitalize="none"
                  spellcheck="false"
                  placeholder="Type the romaji answer"
                />
                <button
                  type="submit"
                  id="answer-submit-button"
                  class="primary-button"
                >
                  Submit
                </button>
              </div>
              <output
                id="answer-result"
                class="answer-result"
                aria-live="polite"
              ></output>
            </form>

            <div class="toolbar quiz-toolbar">
              <button
                type="button"
                id="next-button"
                class="primary-button"
                disabled
              >
                Next Card
              </button>
              <button
                type="button"
                id="change-settings-button"
                class="secondary-button"
              >
                Change Sets
              </button>
            </div>
          </section>
        </div>
      </section>

      <section
        id="symbols-panel"
        class="symbols-panel"
        aria-labelledby="symbols-title"
      >
        <header class="symbols-header">
          <h2 id="symbols-title">Hiragana Characters</h2>
        </header>
        <div id="symbols-list" class="symbols-list"></div>
      </section>
    </main>

    <script src="assets/js/app.js"></script>
  </body>
</html>
